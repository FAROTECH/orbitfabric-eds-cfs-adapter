name: C1 Installed Lifecycle

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  installed-lifecycle:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout adapter
        uses: actions/checkout@v4

      - name: Checkout exact OrbitFabric Core 1.3.0 baseline
        uses: actions/checkout@v4
        with:
          repository: FAROTECH/orbitfabric
          ref: a25917e81c90396df2b189834e83cf852fa4da5f
          path: _orbitfabric_core

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install host tooling and exact Core baseline
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m pip install ./_orbitfabric_core

      - name: Run C1 installed lifecycle proof
        run: bash .github/scripts/installed-lifecycle.sh

      - name: Upload C1 installed lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eds-cfs-c1-installed-lifecycle
          path: /tmp/orbitfabric-eds-cfs-installed-lifecycle/evidence
          if-no-files-found: warn
