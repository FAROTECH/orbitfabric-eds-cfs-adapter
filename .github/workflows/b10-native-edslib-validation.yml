name: B10 Native EdsLib Validation

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  b10-native-edslib:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install pinned-lane host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            git \
            pkg-config \
            libexpat1-dev \
            liblua5.3-dev \
            libjson-c-dev \
            python3-dev

      - name: Execute exact cFS/EdsLib native validation harness
        run: .github/scripts/b10-native-edslib.sh

      - name: Upload B10 native validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: eds-cfs-p0-b10-native-edslib
          path: ${{ runner.temp }}/orbitfabric-eds-cfs-b10-evidence
          if-no-files-found: error
