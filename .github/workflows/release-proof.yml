name: C2 Release Proof

on:
  pull_request:
  push:
    branches:
      - main

env:
  ORBITFABRIC_CORE_REPOSITORY: FAROTECH/orbitfabric
  ORBITFABRIC_CORE_REF: a25917e81c90396df2b189834e83cf852fa4da5f

jobs:
  release-proof:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout adapter
        uses: actions/checkout@v4

      - name: Checkout exact OrbitFabric Core 1.3.0 baseline
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ORBITFABRIC_CORE_REPOSITORY }}
          ref: ${{ env.ORBITFABRIC_CORE_REF }}
          path: _orbitfabric_core

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install host tooling and exact Core baseline
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m pip install ./_orbitfabric_core

      - name: Run C2 release proof
        run: bash .github/scripts/release-proof.sh

      - name: Upload C2 release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eds-cfs-c2-release-proof
          path: /tmp/orbitfabric-eds-cfs-release-proof/evidence
          if-no-files-found: warn
