name: P2 Runtime Proof

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  p2-runtime-proof:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install pinned-lane host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            git \
            pkg-config \
            libexpat1-dev \
            liblua5.3-dev \
            libjson-c-dev \
            python3-dev

      - name: Execute P2-A EDS-backed runtime proof
        run: bash .github/scripts/p2-runtime-proof.sh

      - name: Upload P2 runtime evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: eds-cfs-p2-runtime-proof
          path: ${{ runner.temp }}/orbitfabric-eds-cfs-p2-runtime-evidence
          if-no-files-found: error
