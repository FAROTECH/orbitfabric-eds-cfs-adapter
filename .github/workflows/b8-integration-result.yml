name: B8 Integration Result

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  b8-integration-result:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install adapter and exact OrbitFabric Core 1.3.0 baseline
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install "orbitfabric @ git+https://github.com/FAROTECH/orbitfabric.git@a25917e81c90396df2b189834e83cf852fa4da5f"

      - name: Materialize deterministic P0 mission workspace
        run: |
          rm -rf /tmp/orbitfabric-eds-cfs-p0-mission
          mkdir -p /tmp/orbitfabric-eds-cfs-p0-mission
          cp -a tests/fixtures/p0_b1/mission/. /tmp/orbitfabric-eds-cfs-p0-mission/

      - name: Generate exact Core Integration Input Set
        run: |
          rm -rf /tmp/eds-cfs-b8-core-input
          orbitfabric export integration-input-set /tmp/orbitfabric-eds-cfs-p0-mission \
            --output-dir /tmp/eds-cfs-b8-core-input

      - name: Execute public B8 adapter entry point
        run: |
          rm -rf /tmp/eds-cfs-b8-output
          orbitfabric-eds-cfs run \
            --operation eds_cfs_projection \
            --input-set-manifest /tmp/eds-cfs-b8-core-input/integration_input_manifest.json \
            --profile tests/fixtures/p0_b3/profile.yaml \
            --output-dir /tmp/eds-cfs-b8-output

      - name: Validate Result with exact Core v1 conformance checker
        run: |
          python -m orbitfabric.conformance.integration_contracts result \
            src/orbitfabric_eds_cfs_adapter/integration_package.json \
            /tmp/eds-cfs-b8-output/integration_result.json

      - name: Audit B8 bundle, provenance, traceability reuse and coverage
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("/tmp/eds-cfs-b8-output")
          result_path = root / "integration_result.json"
          trace_path = root / "traceability.json"
          eds_path = root / "eds" / "mission.xml"
          profile_path = Path("tests/fixtures/p0_b3/profile.yaml")
          golden_path = Path("tests/fixtures/p0_b8/expected.json")

          expected_files = {
              "eds/mission.xml",
              "traceability.json",
              "integration_result.json",
          }
          actual_files = {
              path.relative_to(root).as_posix()
              for path in root.rglob("*")
              if path.is_file()
          }
          assert actual_files == expected_files

          result = json.loads(result_path.read_text(encoding="utf-8"))
          trace = json.loads(trace_path.read_text(encoding="utf-8"))

          assert result["kind"] == "orbitfabric.integration_result"
          assert result["result_version"] == "0.2-candidate"
          assert result["result"] == "succeeded"
          assert result["operation"] == {"id": "eds_cfs_projection"}
          assert result["inputs"]["operation_inputs"] == []
          assert result["inputs"]["core_input_set"]["sha256"] == (
              "e8b70eebbda845a91546f40121ee6d927f96a2a39de2776437930e009b20bc98"
          )
          assert result["inputs"]["profile"]["sha256"] == hashlib.sha256(
              profile_path.read_bytes()
          ).hexdigest()
          assert result["inputs"]["profile"]["sha256"] == (
              "bf5e5d4f85636c3f389da091a71a30b785125aaa559145cf899d90431738ed18"
          )

          assert result["capabilities"] == [
              "artifact_generation",
              "profile_validation",
              "projection",
              "traceability",
          ]
          assert result["diagnostics"] == []
          assert result["evidence"] == []
          assert result["external_tools"] == []

          assert result["mappings"] == trace["mappings"]
          assert result["resolutions"] == trace["resolutions"]

          command_allocation = next(
              item for item in result["resolutions"]
              if item["id"] == "resolution.commands.payload.enable.command_topic_ref"
          )
          assert command_allocation["property"] == "cfs.command_topic_ref"
          assert command_allocation["value"] == "CFE_MISSION/OF_DEMO_CMD_TOPICID"
          assert command_allocation["origin"] == "profile"

          telemetry_allocation = next(
              item for item in result["resolutions"]
              if item["id"] == "resolution.packets.payload_status.telemetry_topic_ref"
          )
          assert telemetry_allocation["property"] == "cfs.telemetry_topic_ref"
          assert telemetry_allocation["value"] == "CFE_MISSION/OF_DEMO_STATUS_TLM_TOPICID"
          assert telemetry_allocation["origin"] == "profile"

          coverage = result["coverage"]
          assert coverage["status"] == "complete"
          assert coverage["scope"] == {
              "domains": ["commands", "packets", "telemetry"]
          }
          assert coverage["summary"] == {"projected": 5}
          assert len(coverage["records"]) == 5
          assert all(record["state"] == "projected" for record in coverage["records"])

          artifacts = {item["id"]: item for item in result["artifacts"]}
          assert artifacts["eds.package"]["sha256"] == hashlib.sha256(
              eds_path.read_bytes()
          ).hexdigest()
          assert artifacts["traceability"]["sha256"] == hashlib.sha256(
              trace_path.read_bytes()
          ).hexdigest()
          assert artifacts["eds.package"]["sha256"] == (
              "afac1000713f6fdb0b15cdf71641b40c346c29fcf63ab074a934b6b7dfb969bb"
          )
          assert artifacts["traceability"]["sha256"] == (
              "3480f57f0461839ec66b62ded192be2aac71f2446b5baa869e82f410256a20f8"
          )

          enabled = next(
              item for item in result["resolutions"]
              if item["id"] == "resolution.telemetry.payload.enabled.type_ref"
          )
          assert enabled["value"] == "Boolean8"
          assert enabled["origin"] == "adapter_default"

          result_bytes = result_path.read_bytes()
          assert result_bytes == golden_path.read_bytes()
          assert len(result_bytes) == 13271
          assert hashlib.sha256(result_bytes).hexdigest() == (
              "38705931d3c89b16522c94ff180dcaa349ded32f8d51cab04d2b85389a274322"
          )
          print("B8 Core-conformant Integration Result: PASS")
          PY

      - name: Upload B8 integration bundle
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: eds-cfs-p0-b8-integration-bundle
          path: /tmp/eds-cfs-b8-output
          if-no-files-found: error
