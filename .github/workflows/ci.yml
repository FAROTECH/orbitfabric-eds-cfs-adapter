name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  c0-checks:
    strategy:
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install adapter and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Install exact OrbitFabric Core 1.3.0 conformance baseline
        run: |
          python -m pip install "orbitfabric @ git+https://github.com/FAROTECH/orbitfabric.git@a25917e81c90396df2b189834e83cf852fa4da5f"

      - name: Ruff
        run: ruff check .

      - name: C0 repository consistency
        run: python tools/check_repository_consistency.py

      - name: Core and adapter tests
        run: pytest -q

      - name: Build wheel
        run: python -m build --wheel

      - name: Verify wheel owns required packaged assets
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile

          wheel = next(Path("dist").glob("*.whl"))
          with zipfile.ZipFile(wheel) as archive:
              names = set(archive.namelist())
          required = {
              "orbitfabric_eds_cfs_adapter/integration_package.json",
              "orbitfabric_eds_cfs_adapter/schemas/profile-0.1.schema.json",
          }
          missing = sorted(required - names)
          if missing:
              raise SystemExit("Missing wheel assets: " + ", ".join(missing))
          PY

  b1-core-fixture:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install exact OrbitFabric Core 1.3.0 baseline and adapter
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "orbitfabric @ git+https://github.com/FAROTECH/orbitfabric.git@a25917e81c90396df2b189834e83cf852fa4da5f"

      - name: Materialize deterministic B1 mission workspace
        run: |
          rm -rf /tmp/orbitfabric-eds-cfs-p0-mission
          mkdir -p /tmp/orbitfabric-eds-cfs-p0-mission
          cp -a tests/fixtures/p0_b1/mission/. /tmp/orbitfabric-eds-cfs-p0-mission/

      - name: Generate B1 Core Integration Input Set
        run: |
          rm -rf /tmp/eds-cfs-b1-integration-input
          orbitfabric export integration-input-set /tmp/orbitfabric-eds-cfs-p0-mission \
            --output-dir /tmp/eds-cfs-b1-integration-input

      - name: Validate B1 generated set
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("/tmp/eds-cfs-b1-integration-input")
          expected = {
              "integration_input_manifest.json",
              "mission_snapshot.json",
              "entity_index.json",
              "relationship_manifest.json",
              "lint_report.json",
              "model_summary.json",
          }
          actual = {path.name for path in root.iterdir() if path.is_file()}
          if actual != expected:
              raise SystemExit(f"Unexpected B1 file set: {sorted(actual)}")

          manifest = json.loads((root / "integration_input_manifest.json").read_text())
          if manifest["kind"] != "orbitfabric.integration_input_set":
              raise SystemExit("Unexpected input-set kind")
          if manifest["input_set_version"] != "0.1-candidate":
              raise SystemExit("Unexpected input-set version")
          if manifest["orbitfabric_version"] != "1.3.0":
              raise SystemExit("Unexpected OrbitFabric version")
          if manifest["mission"] != {"id": "eds-cfs-p0", "model_version": "0.1.0"}:
              raise SystemExit("Unexpected mission identity")
          if manifest["load_result"] != "loaded":
              raise SystemExit("Mission did not load")
          if manifest["lint_result"] not in {"passed", "passed_with_warnings"}:
              raise SystemExit(f"Mission lint did not pass: {manifest['lint_result']}")

          for name in (
              "mission_snapshot.json",
              "entity_index.json",
              "relationship_manifest.json",
              "model_summary.json",
          ):
              payload = json.loads((root / name).read_text())
              if payload["source"]["mission_dir"] != "/tmp/orbitfabric-eds-cfs-p0-mission":
                  raise SystemExit(f"Non-deterministic mission provenance in {name}")

          print("B1 Core Integration Input Set generation: PASS")
          PY

      - name: Compare generated bytes with retained B1 digests
        run: |
          cd /tmp/eds-cfs-b1-integration-input
          sha256sum -c "$GITHUB_WORKSPACE/tests/fixtures/p0_b1/integration_input/SHA256SUMS"

      - name: Consume real B1 set through frozen B2 loader
        run: |
          python - <<'PY'
          from pathlib import Path

          from orbitfabric_eds_cfs_adapter.input_set import load_input_set

          root = Path("/tmp/eds-cfs-b1-integration-input")
          loaded = load_input_set(root / "integration_input_manifest.json")

          assert loaded.manifest["input_set_sha256"] == (
              "e8b70eebbda845a91546f40121ee6d927f96a2a39de2776437930e009b20bc98"
          )
          assert loaded.resolve_entity("commands", "payload.enable")["id"] == "payload.enable"
          assert loaded.resolve_entity("commands", "payload.set_period")["id"] == "payload.set_period"
          assert loaded.resolve_entity("telemetry", "payload.enabled")["id"] == "payload.enabled"
          assert loaded.resolve_entity("telemetry", "payload.sample_count")["id"] == "payload.sample_count"
          assert set(loaded.packet_telemetry_ids("payload_status")) == {
              "payload.enabled",
              "payload.sample_count",
          }
          assert len(loaded.lint_warnings) == 6

          print("B2 loader against real Core B1 output: PASS")
          PY

      - name: Resolve real B3 Profile against real B1 Core set
        run: |
          python - <<'PY'
          from pathlib import Path

          from orbitfabric_eds_cfs_adapter.input_set import load_input_set
          from orbitfabric_eds_cfs_adapter.profile import load_profile
          from orbitfabric_eds_cfs_adapter.projection.resolution import resolve_profile

          root = Path("/tmp/eds-cfs-b1-integration-input")
          core = load_input_set(root / "integration_input_manifest.json")
          profile = load_profile(Path("tests/fixtures/p0_b3/profile.yaml"))
          resolved = resolve_profile(profile, core)

          assert resolved.package_name == "OF_DEMO"
          assert resolved.component_name == "Application"
          assert (resolved.command_interface.name, resolved.command_interface.topic_id) == (
              "CMD",
              160,
          )
          assert (resolved.telemetry_interface.name, resolved.telemetry_interface.topic_id) == (
              "STATUS_TLM",
              161,
          )
          assert [(item.source_id, item.function_code) for item in resolved.commands] == [
              ("payload.enable", 0),
              ("payload.set_period", 1),
          ]
          period = resolved.commands[1].arguments[0]
          assert (period.name, period.semantic_type) == ("period_ms", "uint32")
          assert (period.minimum, period.maximum) == (100, 60000)
          assert period.enum is None
          assert period.default is None
          assert [field.source_id for field in resolved.packets[0].fields] == [
              "payload.enabled",
              "payload.sample_count",
          ]
          assert [field.semantic_type for field in resolved.packets[0].fields] == [
              "bool",
              "uint32",
          ]
          assert len(resolved.lint_warnings) == 6

          print("B4 real Profile/Core resolution: PASS")
          PY

      - name: Print B1 generated set for review
        run: |
          for file in integration_input_manifest.json mission_snapshot.json entity_index.json relationship_manifest.json lint_report.json model_summary.json; do
            echo "===== B1 FILE: ${file} ====="
            cat "/tmp/eds-cfs-b1-integration-input/${file}"
            echo
            echo "===== END B1 FILE: ${file} ====="
          done

      - name: Upload B1 generated set
        uses: actions/upload-artifact@v4
        with:
          name: eds-cfs-p0-b1-core-integration-input
          path: /tmp/eds-cfs-b1-integration-input
          if-no-files-found: error
